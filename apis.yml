aid: clasp-therapeutics
name: Clasp Therapeutics
description: 'Clasp Therapeutics, Inc. is a clinical-stage precision immuno-oncology
  company developing next-generation T cell engagers (TCEs) built on its proprietary
  pHLAre platform, which redirects T cells to mutant peptides — such as p53 R175H and
  mutant KRAS — presented by specific HLA molecules on the surface of tumor cells.
  The approach is intended to yield off-the-shelf, antibody-like medicines that hit
  common oncogenic driver mutations with tumor-exclusive specificity. Its lead
  candidate CLSP-1025 (p53 R175H / HLA-A*02:01) is in the Phase 1 GUARDIAN-101 trial
  (NCT06778863), and CLSP-5282, a first-in-class KRas-directed TCE, was unveiled at
  AACR 2026. Founded on research from Bert Vogelstein, Drew Pardoll and colleagues at
  Johns Hopkins, the company launched in March 2024 with $150 million led by Catalio
  Capital Management, Third Rock Ventures and Novo Holdings, and operates from
  Cambridge, Massachusetts and Rockville, Maryland. Clasp Therapeutics is a
  therapeutics developer and publishes no public API, developer program, SDK, or
  machine-readable specification.'
